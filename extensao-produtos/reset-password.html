<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha | Artcolor Comunicação Visual</title>
    <meta name="description" content="Redefina a senha da sua conta Artcolor com segurança." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#151515" />
    <link rel="canonical" href="https://artcolorcv.com.br/reset-password.html" />
    <link rel="icon" type="image/png" href="assets/marca/favicon.png" />
    <link rel="apple-touch-icon" href="assets/marca/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <header class="topbar quote-topbar">
      <a class="brand magnetic-link" href="index.html#inicio" aria-label="Voltar para início da Artcolor Comunicação Visual">
        <img src="assets/marca/logo.png" alt="Artcolor Comunicação Visual" />
      </a>
      <nav class="quote-nav" aria-label="Navegação da recuperação">
        <a class="ghost-action magnetic-link" href="login.html">Entrar</a>
        <a class="secondary-action magnetic-link" href="orcamento.html">Orçamento</a>
      </nav>
    </header>

    <main class="auth-main auth-reset-main">
      <section class="auth-reset-panel" aria-labelledby="resetTitle">
        <div>
          <p class="eyebrow">Recuperação de conta</p>
          <h1 id="resetTitle">Crie uma nova senha.</h1>
          <p>
            Use uma senha forte para proteger pedidos, orçamentos e dados da sua conta Artcolor.
          </p>
        </div>

        <form class="auth-form auth-reset-form is-active" id="resetPasswordForm" novalidate>
          <img class="auth-panel-logo" src="assets/marca/logo.png" alt="Artcolor Comunicação Visual" />

          <label class="auth-field">
            <span>Nova senha</span>
            <input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required />
          </label>

          <label class="auth-field">
            <span>Confirmar senha</span>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Repita a nova senha" required />
          </label>

          <p class="auth-hint">
            Use pelo menos 8 caracteres com uma letra maiúscula, um número e um símbolo.
          </p>

          <button class="primary-action magnetic-link" type="submit">Salvar nova senha</button>
          <p class="auth-status" id="resetStatus" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Artcolor LTDA</span>
      <nav aria-label="Links finais">
        <a href="index.html#inicio">Início</a>
        <a href="login.html">Entrar</a>
        <a href="https://wa.me/554699358269" target="_blank" rel="noreferrer">WhatsApp</a>
      </nav>
    </footer>

    <script type="module" src="reset-password.js"></script>
  </body>
</html>
