<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Artcolor Comunicação Visual</title>
    <meta
      name="description"
      content="Acesse sua conta Artcolor para acompanhar pedidos, orçamentos e atendimento."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#151515" />
    <link rel="canonical" href="https://artcolorcv.com.br/login.html" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Artcolor Comunicação Visual" />
    <meta property="og:title" content="Entrar na Artcolor" />
    <meta
      property="og:description"
      content="Acesse sua conta Artcolor para acompanhar orçamentos, pedidos e atendimento."
    />
    <meta property="og:url" content="https://artcolorcv.com.br/login.html" />
    <meta property="og:image" content="https://artcolorcv.com.br/assets/portfolio/empresa.png" />
    <link rel="icon" type="image/png" href="assets/marca/favicon.png" />
    <link rel="apple-touch-icon" href="assets/marca/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <header class="topbar quote-topbar">
      <a class="brand magnetic-link" href="index.html#inicio" aria-label="Voltar para início da Artcolor Comunicação Visual">
        <img src="assets/marca/logo.png" alt="Artcolor Comunicação Visual" />
      </a>
      <nav class="quote-nav" aria-label="Navegação do login">
        <a class="ghost-action magnetic-link" href="index.html#produtos">Produtos</a>
        <a class="secondary-action magnetic-link" href="orcamento.html">Orçamento</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-stage" aria-labelledby="authTitle">
        <div class="auth-showcase">
          <p class="eyebrow">Área do cliente</p>
          <h1 id="authTitle">Entre pro time Artcolor</h1>
          <p>
            Acompanhe orçamentos, pedidos em produção e seu atendimento em um só lugar.
          </p>
          <figure class="auth-illustration">
            <img src="assets/login/time-artcolor.png" alt="Atendente virtual com uniforme da Artcolor Comunicação Visual" />
          </figure>
        </div>

        <div class="auth-side">
          <div class="auth-panel">
            <img class="auth-panel-logo" src="assets/marca/logo.png" alt="Artcolor Comunicação Visual" />
          <div class="auth-tabs" role="tablist" aria-label="Opções de acesso">
            <button class="auth-tab is-active" id="tabLogin" type="button" role="tab" aria-selected="true" aria-controls="loginPanel" data-auth-tab="login">
              Entrar
            </button>
            <button class="auth-tab" id="tabRegister" type="button" role="tab" aria-selected="false" aria-controls="registerPanel" data-auth-tab="register">
              Criar conta
            </button>
            <button class="auth-tab" id="tabRecover" type="button" role="tab" aria-selected="false" aria-controls="recoverPanel" data-auth-tab="recover">
              Recuperar
            </button>
          </div>

          <form class="auth-form is-active" id="loginPanel" role="tabpanel" aria-labelledby="tabLogin" data-auth-panel="login" novalidate>
            <label class="auth-field">
              <span>Usuário</span>
              <input id="loginEmail" name="email" type="email" maxlength="120" autocomplete="email" placeholder="voce@empresa.com.br" required />
            </label>

            <label class="auth-field">
              <span>Senha</span>
              <input id="loginPassword" name="password" type="password" minlength="8" maxlength="72" autocomplete="current-password" placeholder="Sua senha" required />
            </label>

            <label class="auth-check">
              <input id="rememberEmail" name="rememberEmail" type="checkbox" />
              <span>Lembrar apenas meu e-mail neste dispositivo</span>
            </label>

            <button class="primary-action magnetic-link" type="submit">Entrar com segurança</button>
            <p class="auth-status" id="loginStatus" role="status" aria-live="polite"></p>
          </form>

          <form class="auth-form" id="registerPanel" role="tabpanel" aria-labelledby="tabRegister" data-auth-panel="register" novalidate>
            <label class="auth-field">
              <span>Nome completo</span>
              <input id="registerName" name="name" type="text" maxlength="90" autocomplete="name" placeholder="Seu nome" required />
            </label>

            <label class="auth-field">
              <span>E-mail</span>
              <input id="registerEmail" name="email" type="email" maxlength="120" autocomplete="email" placeholder="voce@empresa.com.br" required />
            </label>

            <label class="auth-field">
              <span>Telefone</span>
              <input id="registerPhone" name="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="(46) 99999-9999" required />
            </label>

            <label class="auth-field">
              <span>Senha</span>
              <input id="registerPassword" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required />
            </label>

            <p class="auth-hint">
              Use pelo menos 8 caracteres com uma letra maiúscula, um número e um símbolo.
            </p>

            <button class="primary-action magnetic-link" type="submit">Criar conta</button>
            <p class="auth-status" id="registerStatus" role="status" aria-live="polite"></p>
          </form>

          <form class="auth-form" id="recoverPanel" role="tabpanel" aria-labelledby="tabRecover" data-auth-panel="recover" novalidate>
            <label class="auth-field">
              <span>E-mail da conta</span>
              <input id="recoverEmail" name="email" type="email" maxlength="120" autocomplete="email" placeholder="voce@empresa.com.br" required />
            </label>

            <button class="primary-action magnetic-link" type="submit">Enviar recuperação</button>
            <p class="auth-status" id="recoverStatus" role="status" aria-live="polite"></p>
          </form>
          </div>

        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Artcolor LTDA</span>
      <nav aria-label="Links finais">
        <a href="index.html#inicio">Início</a>
        <a href="orcamento.html">Orçamento</a>
        <a href="https://wa.me/554699358269" target="_blank" rel="noreferrer">WhatsApp</a>
      </nav>
    </footer>

    <script type="module" src="auth.js"></script>
  </body>
</html>
